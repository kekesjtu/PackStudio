[project]
name = "packstudio-research"
version = "0.1.0"
description = "Offline Flotherm PACK research and reference-data tools"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "capstone>=5.0.6,<6",
    "lxml>=5.3,<7.0",
    "numpy>=2.1,<3.0",
    "pefile>=2024.8.26",
    "pytest>=8.3,<10.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests/research"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]