[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "packstudio"
version = "0.1.0"
description = "IC package parametric thermal-model template library"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "lxml>=5.3,<7.0",
    "numpy>=2.1,<3.0",
    "pydantic>=2.10,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<1.0",
]
packaging = [
    "pyinstaller>=6.11,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["packstudio*"]

[tool.setuptools.data-files]
"default_parameters" = ["default_parameters/*.json"]
"default_parameters/templates" = ["default_parameters/templates/*.json"]
"default_parameters/flotherm" = ["default_parameters/flotherm/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests/backend"]

[tool.coverage.run]
branch = true
source = ["packstudio"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
