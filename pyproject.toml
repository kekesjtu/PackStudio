[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "packstudio"
version = "0.1.0"
description = "IC package parametric thermal-model template library"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "lxml>=5.3,<7.0",
    "numpy>=2.1,<3.0",
    "pydantic>=2.10,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "capstone>=5.0.6,<6",
    "httpx2>=2.0,<3.0",
    "pefile>=2024.8.26",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<1.0",
]
packaging = [
    "pyinstaller>=6.11,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["packstudio*"]

[tool.setuptools.data-files]
"default_parameters" = ["default_parameters/*.json"]
"default_parameters/templates" = ["default_parameters/templates/*.json"]
"default_parameters/presets" = ["default_parameters/presets/*.json"]
"default_parameters/presets/chip_array" = ["default_parameters/presets/chip_array/*.json"]
"default_parameters/presets/cbga_fc" = ["default_parameters/presets/cbga_fc/*.json"]
"default_parameters/presets/pbga_fc" = ["default_parameters/presets/pbga_fc/*.json"]
"default_parameters/presets/pqfp" = ["default_parameters/presets/pqfp/*.json"]
"default_parameters/presets/QFN" = ["default_parameters/presets/QFN/*.json"]
"default_parameters/presets/tsop_conv" = ["default_parameters/presets/tsop_conv/*.json"]
"default_parameters/presets/pbga_wb" = ["default_parameters/presets/pbga_wb/*.json"]
"default_parameters/materials" = ["default_parameters/materials/*.json"]
"default_parameters/materials/resins" = ["default_parameters/materials/resins/*.json"]
"default_parameters/materials/leadframe_alloys" = ["default_parameters/materials/leadframe_alloys/*.json"]
"default_parameters/materials/attachment_materials" = ["default_parameters/materials/attachment_materials/*.json"]
"default_parameters/materials/other_alloys" = ["default_parameters/materials/other_alloys/*.json"]
"default_parameters/materials/metals" = ["default_parameters/materials/metals/*.json"]
"default_parameters/materials/ceramics" = ["default_parameters/materials/ceramics/*.json"]
"default_parameters/materials/solder_alloys" = ["default_parameters/materials/solder_alloys/*.json"]
"default_parameters/materials/substrate_dielectrics" = ["default_parameters/materials/substrate_dielectrics/*.json"]
"default_parameters/materials/others" = ["default_parameters/materials/others/*.json"]
"default_parameters/materials/semiconductors" = ["default_parameters/materials/semiconductors/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests/backend"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["packstudio"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
